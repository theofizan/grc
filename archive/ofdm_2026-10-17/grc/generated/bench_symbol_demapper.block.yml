id: bench_symbol_demapper
label: Hard decisions | IQ to unpacked bits
category: '[Antenna benchmark]'

parameters:
-   id: order
    label: Constellation order M
    dtype: int
    default: '16'
    hide: none

inputs:
-   label: samples
    dtype: complex
    vlen: 1

outputs:
-   label: bits
    dtype: byte
    vlen: 1

templates:
    imports: 'from bench_symbol_demapper import bench_symbol_demapper  # grc-generated
        hier_block'
    make: "bench_symbol_demapper(\n    order=${ order },\n)"
    callbacks:
    - set_order(${ order })

documentation: 'Editable stock-block stage. See docs/MODULAR_FLOWGRAPHS.md.

    /Users/ofi/repos/grc/grc/generated/bench_symbol_demapper.py'
grc_source: /Users/ofi/repos/grc/grc/modules/bench_symbol_demapper.grc

file_format: 1
